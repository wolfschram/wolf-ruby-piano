<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: https://tonejs.github.io; connect-src 'self' ws://localhost:* https://tonejs.github.io https://bitmidi.com https://freemidi.org https://www.midiworld.com https://www.kunstderfuge.com http://piano-midi.de https://www.classicalarchives.com https://www.freepianotutorials.net https://www.mutopiaproject.org https://*.github.io" />
    <title>Wolf & Ruby Piano</title>
    <style>
      body { margin: 0; background: #0A0A12; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Fallback: visible until React mounts (proves Electron loaded the page) -->
      <div id="boot-indicator" style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui;color:#666">
        <div style="font-size:48px;margin-bottom:16px">🎹</div>
        <div>Loading Wolf & Ruby Piano...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safety net: if React hasn't mounted after 10s, show error info
      setTimeout(function() {
        var indicator = document.getElementById('boot-indicator');
        if (indicator) {
          indicator.innerHTML = '<div style="font-size:48px;margin-bottom:16px">⚠️</div>' +
            '<div style="color:#CC8833;font-size:18px;font-weight:bold">App failed to load</div>' +
            '<div style="color:#888;margin-top:8px;font-size:13px">Check DevTools console (Cmd+Option+I) for errors</div>' +
            '<div style="color:#555;margin-top:16px;font-size:12px">Then restart with: npm run dev</div>';
        }
      }, 10000);
    </script>
  </body>
</html>
